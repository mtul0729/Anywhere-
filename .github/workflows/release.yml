name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild and verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: source
      - name: Resolve release tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$EVENT_NAME" = workflow_dispatch ]]; then
            TAG="$INPUT_TAG"
          else
            TAG="$REF_NAME"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Resolve version
        id: version
        run: |
          version=$(bash source/.github/scripts/release-version.sh "${{ steps.tag.outputs.tag }}")
          {
            echo "version_name=$(sed -n 's/^version_name=//p' <<< "$version")"
            echo "version_code=$(sed -n 's/^version_code=//p' <<< "$version")"
            echo "prerelease=$(sed -n 's/^prerelease=//p' <<< "$version")"
          } >> "$GITHUB_OUTPUT"
      - name: Check release tag ancestry
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          cd source
          git fetch --force origin \
            '+refs/heads/master:refs/remotes/origin/master'
          git checkout --detach "$TAG"
          if ! git merge-base --is-ancestor "$TAG^{commit}" origin/master; then
            echo "$TAG must be reachable from origin/master" >&2
            exit 1
          fi
      - name: Check version ordering
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          used=$(gh release list --limit 100 --json tagName --jq '.[].tagName' || true)
          if grep -Fxq "$TAG" <<< "$used"; then
            echo "$TAG already has a release; reruns will verify it without replacing assets."
            exit 0
          fi

          highest=0
          while IFS= read -r other; do
            [[ -n "$other" ]] || continue
            code=$(bash source/.github/scripts/release-version.sh "$other" 2>/dev/null | sed -n 's/^version_code=//p') || continue
            if (( code > highest )); then
              highest=$code
            fi
          done <<< "$used"

          if (( VERSION_CODE <= highest )); then
            echo "$TAG resolves to versionCode $VERSION_CODE, not above existing $highest" >&2
            exit 1
          fi
      - name: Build unsigned release APK
        working-directory: source
        run: |
          bash ./gradlew \
            -PappVerName="${{ steps.version.outputs.version_name }}" \
            -PappVerCode="${{ steps.version.outputs.version_code }}" \
            assembleRelease
      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v7
        with:
          name: release-unsigned
          path: source/app/build/outputs/apk/release/*.apk
          retention-days: 7
      - name: Upload release mappings
        uses: actions/upload-artifact@v7
        with:
          name: release-mappings
          path: source/app/build/outputs/mapping/release
          retention-days: 7

  publish:
    name: Sign and publish
    needs: prepare
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION_NAME: ${{ needs.prepare.outputs.version_name }}
      VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 17
      - name: Download unsigned release APK
        uses: actions/download-artifact@v8
        with:
          name: release-unsigned
          path: dist
      - name: Download release mappings
        uses: actions/download-artifact@v8
        with:
          name: release-mappings
          path: dist/mappings
      - name: Prepare signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
        run: |
          if [[ -z "$SIGNING_KEY" || -z "$KEY_STORE_PASSWORD" || -z "$KEY_ALIAS" ]]; then
            echo "Missing release environment secrets" >&2
            exit 1
          fi
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Sign release APK
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
        run: |
          apk=$(find dist -maxdepth 1 -name '*.apk' -print -quit)
          aligned="$RUNNER_TEMP/release-aligned.apk"
          signed="$RUNNER_TEMP/release-signed.apk"
          zipalign=$(find "$ANDROID_HOME/build-tools" -name zipalign | sort -V | tail -n 1)
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$zipalign" -p -f 4 "$apk" "$aligned"
          "$apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEY_STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$signed" \
            "$aligned"
          mv "$signed" "$apk"
      - name: Verify release APK
        run: |
          apk=$(find dist -maxdepth 1 -name '*.apk' -print -quit)
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          aapt=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -n 1)

          cert_output=$("$apksigner" verify --verbose --print-certs "$apk")
          printf '%s\n' "$cert_output"
          cert_md5=$(printf '%s\n' "$cert_output" \
            | sed -n 's/^.*certificate MD5 digest: //p' \
            | tr '[:lower:]' '[:upper:]' \
            | head -n 1)
          if [[ -z "$cert_md5" ]]; then
            echo "Could not read the APK signing certificate" >&2
            exit 1
          fi

          badging=$("$aapt" dump badging "$apk")
          actual_package=$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" <<< "$badging")
          actual_code=$(sed -n "s/^package:.* versionCode='\([^']*\)'.*/\1/p" <<< "$badging")
          actual_name=$(sed -n "s/^package:.* versionName='\([^']*\)'.*/\1/p" <<< "$badging")
          [[ "$actual_package" = com.absinthe.anywhere_ ]]
          [[ "$actual_code" = "$VERSION_CODE" ]]
          [[ "$actual_name" = "$VERSION_NAME" ]]

          sha256=$(sha256sum "$apk" | cut -d' ' -f1)
          echo "APK_SHA256=$sha256" >> "$GITHUB_ENV"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving its assets unchanged."
            exit 0
          fi

          COMMIT_SHA=$(git rev-parse HEAD)
          notes=$(mktemp)
          {
            echo "Commit: \`$COMMIT_SHA\`"
            echo "versionCode: \`$VERSION_CODE\`"
            echo "APK SHA256: \`$APK_SHA256\`"
          } > "$notes"

          if [[ "$PRERELEASE" = true ]]; then
            gh release create "$TAG" dist/*.apk \
              --verify-tag \
              --title "Anywhere- $VERSION_NAME (alpha)" \
              --prerelease \
              --generate-notes \
              --notes "$(cat "$notes")"
          else
            gh release create "$TAG" dist/*.apk \
              --verify-tag \
              --title "Anywhere- $VERSION_NAME" \
              --generate-notes \
              --notes "$(cat "$notes")"
          fi
